<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Keep — Your keys. One place.</title>
  <desc id="banner-desc">Keep API key vault. A white wordmark on a charcoal background beside layered credential cards with masked values and a lock.</desc>
